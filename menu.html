<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maternis</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            font-family: 'Poppins', sans-serif;
        }

        body{
            background:#F8F4FF;
            padding-bottom:90px;
        }

        /* HEADER */

        .topo{

            background:linear-gradient(135deg,#F78FB3,#D980FA);
            color:white;
            padding:35px 25px;
            border-bottom-left-radius:35px;
            border-bottom-right-radius:35px;

        }

        .topo h2{
            font-weight:700;
        }

        .topo p{
            margin:0;
            opacity:.9;
        }

        /* CARD IA */

        .card-ia{

            margin-top:-30px;
            background:white;
            border:none;
            border-radius:20px;
            box-shadow:0 8px 20px rgba(0,0,0,.08);

        }

        .btn-ia{

            background:#D980FA;
            color:white;
            border-radius:12px;

        }

        .btn-ia:hover{

            background:#c15df2;
            color:white;

        }

        /* MENU */

        .titulo{

            font-weight:600;
            margin-top:30px;
            margin-bottom:18px;

        }

        .menu-card{

            background:white;
            border:none;
            border-radius:18px;
            box-shadow:0 5px 15px rgba(0,0,0,.06);
            transition:.3s;
            cursor:pointer;

        }

        .menu-card:hover{

            transform:translateY(-5px);

        }

        .icone{

            width:65px;
            height:65px;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:28px;
            margin:auto;
            color:white;

        }

        .rosa{

            background:#F78FB3;

        }

        .roxo{

            background:#9B59B6;

        }

        .azul{

            background:#6C63FF;

        }

        .verde{

            background:#2ECC71;

        }

        .laranja{

            background:#F39C12;

        }

        .vermelho{

            background:#E74C3C;

        }

        .menu-card h6{

            margin-top:15px;
            font-weight:600;

        }

        /* MENU INFERIOR */

        .bottom{

            position:fixed;
            bottom:0;
            left:0;
            width:100%;
            background:white;
            box-shadow:0 -5px 15px rgba(0,0,0,.08);

        }

        .bottom a{

            color:#888;
            text-decoration:none;
            font-size:13px;

        }

        .bottom i{

            display:block;
            font-size:22px;

        }

        .ativo{

            color:#D980FA;

        }

        .banner-mae img{
    width:25%;
    height:auto;
    display;block;
    border-radius:50px;

}

    </style>

</head>
<body>

<div class="topo">

    <h2>Olá, Mamãe 👋</h2>

    <p>Bem-vinda ao Maternis</p>

</div>

<div class="container">

    <div class="card card-ia p-4">

        <div class="row align-items-center">


<div class="banner-mae mt-3 mb-4 text-center">

    <img src="img/bebe-mao.jpg" class="img-fluid rounded-4 shadow" alt="Mãe segurando bebê">

</div>

    <h5 class="titulo">

        Funcionalidades

    </h5>

    <div class="row g-3">

        <div class="col-6">
<a href="gestacao.html" class="text-decoration-none text-dark">
            <div class="card menu-card text-center p-3">

                <div class="icone rosa">

                    <i class="bi bi-heart-pulse"></i>

                </div>

                <h6>Gestação</h6>

            </div>
        </a>
        </div>

        <div class="col-6">
<a href="bebe.html" class="text-decoration-none text-dark">
            <div class="card menu-card text-center p-3">

                <div class="icone roxo">

                    <i class="bi bi-emoji-smile"></i>

                </div>

                <h6>Bebê</h6>

            </div>
</a>
        </div>
<a href="vacinas.html" class="text-decoration-none text-dark">
        <div class="col-6">

            <div class="card menu-card text-center p-3">

                <div class="icone azul">

                    <i class="bi bi-capsule"></i>

                </div>

                <h6>Vacinas</h6>

            </div>
        </a>
        </div>

        <div class="col-6">
<a href="consultas.html" class="text-decoration-none text-dark">
            <div class="card menu-card text-center p-3">

                <div class="icone verde">

                    <i class="bi bi-calendar-check"></i>

                </div>

                <h6>Consultas</h6>

            </div>
        </a>
        </div>

        <div class="col-md-6 mx-auto">
<a href="dicas.html" class="text-decoration-none text-dark">
            <div class="card menu-card text-center p-3">

                <div class="icone laranja">

                    <i class="bi bi-book-half"></i>

                </div>

                <h6>Dicas</h6>

            </div>
</a>
        </div>

    </div>

</div>

<nav class="bottom py-2">

<div class="container">

<div class="row text-center">

</div>

</div>

</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
